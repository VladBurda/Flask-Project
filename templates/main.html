<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Page</title>
    <style>
        body {
            display: flex;
            margin: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
        }

        .sidebar {
            width: 200px;
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            height: 100vh;

        }

        .content {
            flex-grow: 1;
            padding: 20px;
        }

        button {
            padding: 10px;
            font-size: 16px;
            background-color: rgb(80, 94, 123);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .group-list {
            list-style: none;
            padding: 0;
        }

        .group-list li {
            background: #f4f4f4;
            margin: 5px 0;
            padding: 10px;
            border-radius: 5px;
        }

        .btn {
             display: inline-block;
             padding: 10px 15px;
              background-color: rgb(80, 94, 123);
              color: white;
              border: none;
              cursor: pointer;
              text-decoration: none;
              border-radius: 5px;
}

    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Menu Bar</h2>
    </div>
    <div class="content">
        <h1>Welcome, {{ username }}!</h1>
        <button onclick="window.location.href='/create_group'">Create Group</button>
        <h2>Your Groups:</h2>
        <ul class="group-list">
            {% for group_id, group in groups.items() %}
                <div class="group">
                    <h2><a href="{{ url_for('group_details', group_id=group_id) }}">{{ group.group_name }}</a></h2>
                    <p>{{ group.description }}</p>
                </div>
            {% endfor %}
        </ul>
        <a href="{{ url_for('logout') }}" class="btn">Log Out</a>
    </div>
</body>
</html>
